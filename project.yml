name: BugoIdle
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  BugoIdle:
    type: application
    platform: iOS
    sources: [BugoIdle]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bugoidle.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bugo-Idle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"

