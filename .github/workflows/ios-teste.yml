name: Bugo-Idle IPA de teste
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Gerar e compilar
        run: |
          mkdir source
          unzip -q BugoIdle-source.zip -d source
          cd source
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -project BugoIdle.xcodeproj -scheme BugoIdle -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Empacotar IPA
        run: |
          mkdir Payload
          cp -R source/build/Build/Products/Release-iphoneos/BugoIdle.app Payload/
          test -f Payload/BugoIdle.app/Automation.js
          /usr/bin/zip -qry BugoIdle.ipa Payload
      - uses: actions/upload-artifact@v6
        with:
          name: BugoIdle-IPA
          path: BugoIdle.ipa
          if-no-files-found: error
